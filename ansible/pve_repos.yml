---

- hosts: proxmox
  become: true
  vars:
    debian_codename: trixie

  tasks:
    - name: Mögliche Enterprise-Repo-Dateien prüfen (altes .list- und neues .sources-Format)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.list
        - /etc/apt/sources.list.d/pve-enterprise.sources
        - /etc/apt/sources.list.d/ceph.list
        - /etc/apt/sources.list.d/ceph.sources
      register: enterprise_repo_files

    - name: Gefundene Enterprise-Repo-Dateien deaktivieren (umbenennen)
      ansible.builtin.command: mv {{ item.item }} {{ item.item }}.disabled
      loop: "{{ enterprise_repo_files.results }}"
      when: item.stat.exists
      args:
        creates: "{{ item.item }}.disabled"

    - name: No-Subscription-Repo eintragen
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/pve-no-subscription.list
        content: "deb http://download.proxmox.com/debian/pve {{ debian_codename }} pve-no-subscription\n"
        owner: root
        group: root
        mode: "0644"

    - name: Paketlisten aktualisieren
      ansible.builtin.apt:
        update_cache: true

    - name: System aktualisieren
      ansible.builtin.apt:
        upgrade: dist